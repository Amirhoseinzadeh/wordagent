# این گردش‌کار همان کاری را انجام می‌دهد که هنگام کار روی پروژه لازم است:
# وابستگی‌ها، تحلیل ایستا، تست‌ها و یک بیلد واقعی وب (به‌عنوان کنترل نهایی
# این‌که همه‌ی لایه‌ها روی یک پلتفرم واقعی کامپایل می‌شوند).
#
# خروجی هر مرحله در یک کامنت روی همان کامیت منتشر می‌شود تا نتیجه‌ی
# analyze/test/build از هر محیطی قابل خواندن باشد.
name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze-and-test:
    name: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: نمایش نسخه‌ی ابزار
        run: flutter --version

      - name: وابستگی‌ها
        run: flutter pub get

      # هر سه مرحله اجرا می‌شوند تا در یک اجرا بیشترین بازخورد را بگیریم؛
      # خروجی هر مرحله در فایل ذخیره می‌شود و در گام «گزارش» به یک کامنت
      # روی کامیت تبدیل می‌شود (خواندن لاگ اکشن‌ها از این محیط ممکن نیست).
      - name: تحلیل، تست و ساخت
        id: checks
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          ANALYZE_EXIT=$?
          flutter test --reporter expanded > test.txt 2>&1
          TEST_EXIT=$?
          flutter build web --release > build.txt 2>&1
          BUILD_EXIT=$?
          {
            echo "ANALYZE_EXIT=$ANALYZE_EXIT"
            echo "TEST_EXIT=$TEST_EXIT"
            echo "BUILD_EXIT=$BUILD_EXIT"
          } > status.env
          cat status.env
          exit 0

      - name: گزارش
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "## CI report — \`${GITHUB_SHA:0:7}\`"
            echo
            echo '```'
            cat status.env
            echo '```'
            echo
            echo "### تست‌های شکست‌خورده (فهرست)"
            echo '```'
            grep -A200 '^Failing tests:' test.txt | head -c 2500
            echo '```'
            echo
            echo "### جزئیات خطاهای تست"
            echo '```'
            grep -B1 -A14 '\[E\]' test.txt | head -c 22000
            echo '```'
            echo
            echo "### flutter analyze (فقط ایرادها)"
            echo '```'
            grep -E '(error|warning|info) •' analyze.txt | head -c 14000
            echo
            echo '... [tail] ...'
            tail -c 1200 analyze.txt
            echo '```'
            echo
            echo "### flutter test (انتهای خروجی)"
            echo '```'
            tail -c 6000 test.txt
            echo '```'
            echo
            echo "### flutter build web"
            echo '```'
            tail -c 3000 build.txt
            echo '```'
          } > report.raw.md
          head -c 60000 report.raw.md > report.md
          wc -c report.raw.md report.md
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@report.md && echo 'comment posted' || echo 'comment failed'

      - name: نتیجه‌ی نهایی
        run: |
          set +e
          cat status.env
          source status.env
          if [ "$ANALYZE_EXIT" != "0" ] || [ "$TEST_EXIT" != "0" ] || [ "$BUILD_EXIT" != "0" ]; then
            echo "یکی از مرحله‌ها شکست خورد."
            exit 1
          fi
          echo "همه‌ی مرحله‌ها با موفقیت گذشتند."
