# پیکربندی تحلیل ایستا (flutter analyze)
# مستندات: https://dart.dev/guides/language/analysis-options
#
# یادداشت مهندسی: قوانین اضافه فقط از میان قوانینی انتخاب شده‌اند که
# در کل کدبیس رعایت شده‌اند تا «flutter analyze» بدون هیچ هشداری پاس شود.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"

linter:
  rules:
    # فیلدهای موتورها و مخزن‌ها خصوصی‌اند (`_words`، `_profile`) و پارامترهای
    # نام‌دار نمی‌توانند با «_» شروع شوند؛ پس فرم اولیه‌ساز (`this._x`) این‌جا
    # فقط با افشای عمومی فیلدها یا تغییر نام پارامترها ممکن است. برای حفظ
    # کپسول‌سازی، این قانون خاموش است.
    prefer_initializing_formals: false
    - avoid_empty_else
    - avoid_print
    - prefer_single_quotes
    - use_super_parameters
    - unnecessary_await_in_return
