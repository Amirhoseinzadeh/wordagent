name: wordagent
description: "واژه‌یار — اپلیکیشن هوشمند یادگیری لغات زبان انگلیسی برای فارسی‌زبانان"
publish_to: 'none'

# نسخه‌ی اپلیکیشن (versionName+versionCode در اندروید و CFBundleShortVersionString در iOS)
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# ---------------------------------------------------------------------------
# سیاست وابستگی‌ها (Dependency policy)
# ---------------------------------------------------------------------------
# این پروژه عمداً وابستگی‌های بسیار کمی دارد تا:
#   ۱) بیلد در همه‌ی پلتفرم‌ها سریع و پایدار بماند،
#   ۲) هیچ پکیج شخص‌ثالثی معماری دامنه را گروگان نگیرد،
#   ۳) نسخه‌ی وب/دسکتاپ بدون بازنویسی دامنه اضافه شود.
# مدیریت وضعیت، سیستم طراحی، نمودارها، انیمیشن‌ها و لایه‌ی هوش مصنوعی
# همه با خود Flutter SDK پیاده‌سازی شده‌اند (پوشه‌ی lib/core و lib/domain).
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  # برای بومی‌سازی کامل فارسی (RTL، ویجت‌های Material به زبان فارسی)
  flutter_localizations:
    sdk: flutter

  # آیکون‌های سبک iOS (اختیاری، برای ویجت‌های Cupertino)
  cupertino_icons: ^1.0.8

  # ذخیره‌سازی محلی پیشرفت کاربر (فایل JSON در پوشه‌ی اسناد اپ)
  path_provider: ^2.1.5

  # تلفظ صوتی کلمات با موتور TTS دستگاه (آفلاین، بدون نیاز به سرور)
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/images/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
